{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="content">
    <div class="container-fluid">

        <div class="row">
            <div class="col-md-12">

                <div class="card">

                    <div class="card-header">
                        <div class="card-title">
                            {% if object %}
                                Update College
                            {% else %}
                                Add New College
                            {% endif %}
                        </div>

                        <div class="card-category">
                            Page Subtitle
                        </div>
                    </div>

                    <div class="card-body">

                        <form method="post">
                            {% csrf_token %}

                            <div class="form-group">
                                <label for="{{ form.college_name.id_for_label }}">
                                    College Name:
                                </label>

                                {{ form.college_name }}
                            </div>

                            <div class="form-group">

                                <button type="submit"
                                        class="btn btn-primary btn-rounded">
                                    Save
                                </button>

                                <a href="{% url 'college-list' %}"
                                   class="btn btn-secondary btn-rounded">
                                    Cancel
                                </a>

                            </div>

                        </form>

                    </div>

                </div>

            </div>
        </div>

    </div>
</div>

{% endblock %}
