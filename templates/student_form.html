{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="content">
    <div class="container-fluid">

        <div class="row">
            <div class="col-md-12">

                <div class="card">

                    <div class="card-header">
                        <div class="card-title">
                            {% if object %}
                                Update Student
                            {% else %}
                                Add New Student
                            {% endif %}
                        </div>

                        <div class="card-category">
                            Page Subtitle
                        </div>
                    </div>

                    <div class="card-body">

                        <form method="post">
                            {% csrf_token %}

                            <div class="form-group">
                                <label for="{{ form.student_id.id_for_label }}">
                                    Student ID:
                                </label>
                                {{ form.student_id }}
                            </div>

                            <div class="form-group">
                                <label for="{{ form.lastname.id_for_label }}">
                                    Last Name:
                                </label>
                                {{ form.lastname }}
                            </div>

                            <div class="form-group">
                                <label for="{{ form.firstname.id_for_label }}">
                                    First Name:
                                </label>
                                {{ form.firstname }}
                            </div>

                            <div class="form-group">
                                <label for="{{ form.middlename.id_for_label }}">
                                    Middle Name:
                                </label>
                                {{ form.middlename }}
                            </div>

                            <div class="form-group">
                                <label for="{{ form.program.id_for_label }}">
                                    Program:
                                </label>
                                {{ form.program }}
                            </div>

                            <div class="form-group">

                                <button type="submit"
                                        class="btn btn-primary btn-rounded">
                                    Save
                                </button>

                                <a href="{% url 'student-list' %}"
                                   class="btn btn-secondary btn-rounded">
                                    Cancel
                                </a>

                            </div>

                        </form>

                    </div>

                </div>

            </div>
        </div>

    </div>
</div>

{% endblock %}
